version: 2

sources:
  - name: dev
    database: db
    schema: dev
    tables:
      - name: raw_weather_data
        description: >
          Raw weather observations collected
          from the Weatherstack API.

        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: city
            data_tests:
              - not_null
          - name: country
          - name: temperature
          - name: feelslike
          - name: humidity
          - name: weather_descriptions
          - name: wind_speed
          - name: pressure
          - name: precip
          - name: time

            data_tests:
              - not_null
          - name: inserted_at

            data_tests:
              - not_null
          - name: utc_offset